openapi: 3.0.3
info:
  title: TigerGraph Savanna REST API
  version: v4
  description: >-
    Control-plane API for TigerGraph Savanna. Use it to provision workgroups and workspaces, manage
    cloud providers and add-ons, protect data with backups, control network access, and administer
    an organization.


    Every request needs an API key in the `x-api-key` header. An organization administrator creates
    the key in Savanna under Admin, Settings.


    Paths are relative to `https://api.tgcloud.io`. Most routes live under `/controller/v4/v2`.
    Organization user routes are `/users` and `/users/{userId}/roles`.


    This document is the customer-facing API reference. To read and write graph data inside a
    workspace, call that workspace host with the GSQL and REST++ endpoints.
  contact:
    name: TigerGraph Savanna API reference
    url: https://www.tigergraph.com/docs/savanna/main/rest-api/
servers:
  - url: https://api.tgcloud.io
    description: Savanna control plane
tags:
  - name: Cloud providers
    description: >-
      TigerGraph-operated providers, and Bring Your Own Cloud accounts registered to the
      organization.
  - name: Workgroups
    description: >-
      Containers for workspaces. A workgroup selects the cloud provider, region, and access
      boundary.
  - name: Workspaces
    description: Compute that runs a graph. Creating a workspace also creates its database.
  - name: Add-ons
    description: >-
      Add-ons available to the organization, such as GraphStudio, Insights, and GraphQL, and the
      workspaces they attach to.
  - name: Workspace schedules
    description: Recurring schedules that pause and resume a workspace.
  - name: Databases
    description: The database attached to a workspace. A database is created with its workspace.
  - name: Backups
    description: >-
      Workspace backups, restore jobs, and the backup schedule. A backup schedule is separate from a
      workspace schedule.
  - name: IP allow list
    description: IP addresses and CIDR ranges permitted to reach a workgroup.
  - name: In-database users
    description: GSQL users inside a workspace.
  - name: Organization
    description: Workspace options available to the organization, and the users in it.
security:
  - ApiKeyAuth: []
