site:
  title: Docs
  url: https://www.tigergraph.com/docs
  start_page: savanna:overview:index.adoc

content:
  sources:
    - url: .
      branches: HEAD
      start_paths: [modules/savanna, modules/cloud]

# Markdown twins are produced by the doc-site build, which loads
# ./libs/markdown-for-llm.js from that repo. This playbook does not.

asciidoc:
  extensions:
    - '@asciidoctor/tabs'

output:
  dir: ./build/site

ui:
  bundle:
    url: https://github.com/tigergraph/antora-ui/blob/main/build/ui-bundle.zip?raw=true
    snapshot: true
