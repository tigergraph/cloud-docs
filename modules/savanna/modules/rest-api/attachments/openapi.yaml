components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        API key for TigerGraph Savanna. Send the key in the `x-api-key` request header. Only an
        organization administrator can create one.
  schemas:
    AgentConfig:
      type: object
      properties:
        catalog_activity_update_interval_seconds:
          type: integer
          description: Seconds between catalog activity updates.
        enable_topology_force_update:
          type: boolean
          description: Whether topology updates are forced.
        heartbeat_interval_seconds:
          type: integer
          description: Seconds between agent heartbeats.
        query_activity_update_interval_seconds:
          type: integer
          description: Seconds between query activity updates.
        topology_update_interval_seconds:
          type: integer
          description: Seconds between topology updates.
    AllowedIP:
      type: object
      required:
        - cidr
      properties:
        cidr:
          type: string
          description: >-
            IP address or range in CIDR notation, such as 192.168.1.0/24 for a range or
            192.168.1.2/32 for a single address.
        id:
          type: string
          description: Unique identifier of the allow list entry.
        note:
          type: string
          description: Note recording why the address was allowed.
    Backup:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the backup.
        is_automatic:
          type: boolean
          description: Whether the backup came from the backup schedule rather than a manual request.
        size_bytes:
          type: string
          description: Size of the backup, in bytes.
        status:
          type: string
          description: Current status of the backup.
        tag:
          type: string
          description: Tag that identifies the backup.
        time:
          type: string
          description: Time the backup was taken.
        type:
          type: string
          description: Scope of the data captured by the backup.
        version:
          type: string
          description: TigerGraph version the backup was taken from.
    BackupRestoreStatus:
      type: object
      properties:
        created_at:
          type: string
          description: Time the restore job started.
        name:
          type: string
          description: Name of the restore job.
        output:
          type: string
          description: Log output produced by the restore job.
        status:
          type: string
          description: Current status of the restore job.
    BackupSchedule:
      type: object
      required:
        - schedule
      properties:
        max_backup_files:
          type: integer
          description: Maximum number of backups to keep.
        max_reserved_days:
          type: integer
          description: Number of days a backup is kept before it is removed.
        max_retry:
          type: integer
          description: Number of times a failed backup is retried.
        pause:
          type: boolean
          description: Whether the schedule is paused.
        schedule:
          type: string
          description: Cron expression that sets when the backup runs.
    CloudProviderOptions:
      type: object
      properties:
        account_id:
          type: string
          description: Cloud account identifier associated with the provider.
        secure_connection:
          type: boolean
          description: Whether the provider uses a private, secure connection.
    CloudProviderResource:
      type: object
      properties:
        api_tokens:
          type: array
          items:
            type: string
          description: API tokens associated with the cloud provider.
        availability_zones:
          type: array
          items:
            type: string
          description: Availability zones configured for the cloud provider.
        cluster_enabled_log_types:
          type: array
          items:
            $ref: '#/components/schemas/constants.ClusterLogType'
          description: Kubernetes control-plane log types enabled for the provider.
        component_versions:
          type: string
          description: Versions of the components installed for the provider.
        created_at:
          type: string
          description: Time the cloud provider was created.
        created_by:
          type: string
          description: User who created the cloud provider.
        eks_id:
          type: string
          description: Identifier of the Amazon EKS cluster.
        endpoint_service_name:
          type: string
          description: Name of the private endpoint service.
        id:
          type: string
          description: Unique identifier of the cloud provider.
        last_error:
          type: string
          description: Most recent error reported while provisioning or updating the provider.
        name:
          type: string
          description: Name of the cloud provider.
        node_group_config:
          $ref: '#/components/schemas/aws.NodeGroupConfig'
          description: Configuration of the Kubernetes node groups.
        options:
          $ref: '#/components/schemas/CloudProviderOptions'
          description: Additional cloud-provider configuration options.
        org_id:
          type: string
          description: Unique identifier of the organization that owns the provider.
        platform:
          type: string
          description: Cloud platform that hosts the provider.
        region:
          type: string
          description: Cloud region that hosts the provider.
        role_arn:
          type: string
          description: Amazon Resource Name of the IAM role TigerGraph assumes.
        role_external_id:
          type: string
          description: External identifier used when TigerGraph assumes the IAM role.
        security_group_id:
          type: string
          description: Identifier of the network security group.
        short_id:
          type: string
          description: Short identifier of the cloud provider.
        status:
          type: string
          description: Current status of the cloud provider.
        subnet_id:
          type: array
          items:
            type: string
          description: Identifiers of the subnets used by the provider.
        type:
          type: string
          description: Access type of the cloud provider.
        updated_at:
          type: string
          description: Time the cloud provider was last updated.
        version:
          type: string
          description: Version of the cloud provider deployment.
        version_number:
          type: integer
          description: Internal version number of the cloud provider record.
        vpc_id:
          type: string
          description: Identifier of the virtual private cloud.
        vpc_owned_by_tg:
          type: boolean
          description: Whether TigerGraph owns and manages the virtual private cloud.
        work_dir:
          type: string
          description: Working directory used while provisioning the provider.
    CreateCloudProviderResourceRequest:
      type: object
      properties:
        created_by:
          type: string
          description: User creating the cloud provider.
        name:
          type: string
          description: Name for the new cloud provider.
        options:
          $ref: '#/components/schemas/CloudProviderOptions'
          description: Additional cloud-provider configuration options.
        platform:
          type: string
          description: Cloud platform that hosts the provider.
        region:
          type: string
          description: Cloud region that hosts the provider.
        role_arn:
          type: string
          description: Amazon Resource Name of the IAM role TigerGraph assumes.
        role_external_id:
          type: string
          description: External identifier used when TigerGraph assumes the IAM role.
        type:
          type: string
          description: >-
            Type is used by two sets of API and will be set to 'private' when called by the Admin
            API and 'public' when called by the public cloud provider creation API.
    CreateConfigRequest:
      type: object
      required:
        - config_name
        - config_value
      properties:
        config_name:
          type: string
          description: Name of the configuration.
        config_value:
          type: string
          description: Value of the configuration.
    CreateWorkgroupRequest:
      type: object
      required:
        - cloud_provider_id
      properties:
        cloud_provider_id:
          type: string
          description: Unique identifier of the cloud provider configuration to use.
        enable_application_log:
          type: boolean
          description: Whether application logging is enabled.
        enable_encryption:
          type: boolean
          description: Whether data is encrypted at rest.
        name:
          type: string
          description: Name for the new workgroup.
        platform:
          $ref: '#/components/schemas/Platform'
          description: Cloud platform that hosts the workgroup.
        region:
          type: string
          description: Cloud region that hosts the workgroup.
        shared_storage:
          type: boolean
          description: Whether workspaces in the workgroup share storage.
    CreateWorkspaceRequest:
      type: object
      description: Create Workspace Request
      properties:
        addons:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAddonsRequest'
          description: Add-ons to enable on the new workspace.
        auto_stop_minutes:
          type: integer
          description: Idle minutes before the workspace stops automatically.
        enable_auto_start:
          type: boolean
          description: Whether the workspace starts automatically on access.
        enable_ha:
          type: boolean
          description: >-
            Whether high availability is enabled, which adds redundancy and improves fault
            tolerance.
        is_rw:
          type: boolean
          description: Whether the workspace accepts writes. Backups require a read-write workspace.
        maintenance_window_day_of_week:
          type: integer
          description: Day of the week the maintenance window starts.
        maintenance_window_hour_of_day:
          type: integer
          description: Hour of the day the maintenance window starts.
        maintenance_window_interval_weeks:
          type: integer
          description: Number of weeks between maintenance windows.
        maintenance_window_time_zone:
          type: string
          description: Time zone used for the maintenance window.
        name:
          type: string
          description: Name for the new workspace.
        solution_install_request:
          $ref: '#/components/schemas/SolutionInstallRequest'
          description: Solution to install on the new workspace.
        tg_database_id:
          type: string
          description: Unique identifier of the database to attach.
        tg_version:
          type: string
          description: TigerGraph version to run in the workspace.
        update_strategy:
          type: string
          description: Strategy used to apply workspace updates.
        workspace_type_name:
          type: string
          description: Workspace Type Name TG-0/TG-2
        x_test_env:
          type: string
          description: Reserved for internal testing.
    DeleteBackupRequest:
      type: object
      required:
        - backup_id
      properties:
        backup_id:
          type: string
          description: Unique identifier of the backup to delete.
    Error:
      type: object
      properties:
        FieldName:
          type: string
          description: Field associated with the error.
        Reason:
          type: string
          description: Explanation of why the error occurred.
        Type:
          $ref: '#/components/schemas/ErrorType'
          description: Category of the error.
    ErrorType:
      type: string
      enum:
        - Internal-Error
        - Bad-Request
        - Not-Found
        - Forbidden
        - Unauthorized
        - API-Disabled
        - Quota-Exceed
        - Unknown
    FolderStatistics:
      type: object
      properties:
        backup_size:
          type: integer
          description: Size of backup data, in bytes.
        billed_size:
          type: integer
          description: Storage size counted for billing, in bytes.
        log_size:
          type: integer
          description: Size of log data, in bytes.
        milvus_size:
          type: integer
          description: Size of vector index data, in bytes.
        total_size:
          type: integer
          description: Total storage size, in bytes.
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSize'
          description: Storage used by each workspace.
    IAMUser:
      type: object
      properties:
        auth0UserID:
          type: string
          description: Identifier of the user in the identity provider.
        created:
          type: string
          description: Time the user was created.
        description:
          type: string
          description: Description of the user.
        email:
          type: string
          description: Email address of the user.
        enabled:
          type: boolean
          description: Whether the user can sign in.
        firstName:
          type: string
          description: Given name of the user.
        id:
          type: string
          description: Unique identifier of the user.
        lastName:
          type: string
          description: Family name of the user.
        metadata:
          $ref: '#/components/schemas/tgIAM.Metadata'
          description: Additional details about the user.
        path:
          type: string
          description: Hierarchical path of the user within the organization.
        role:
          type: string
          description: Role assigned to the user.
        tenantID:
          type: string
          description: Unique identifier of the tenant the user belongs to.
        trn:
          type: string
          description: TigerGraph resource name of the user.
        updated:
          type: string
          description: Time the user was last updated.
        username:
          type: string
          description: Username of the user.
    InDatabaseUserRequest:
      type: object
      properties:
        password:
          type: string
          description: Password for the in-database user.
        username:
          type: string
          description: Username for the in-database user.
    OrgListUserResponse:
      type: object
      properties:
        auth0UserID:
          type: string
          description: Identifier of the user in the identity provider.
        authID:
          type: string
          description: Identifier issued by the authentication provider.
        created:
          type: string
          description: Time the user was created.
        email:
          type: string
          description: Email address of the user.
        enabled:
          type: boolean
          description: Whether the user can sign in.
        firstName:
          type: string
          description: Given name of the user.
        id:
          type: string
          description: Unique identifier of the user.
        lastName:
          type: string
          description: Family name of the user.
        metadata:
          $ref: '#/components/schemas/OrgMetadata'
          description: Additional details about the user.
        path:
          type: string
          description: Hierarchical path of the user within the organization.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/OrgRole'
          description: Roles assigned to the user.
        tenantID:
          type: string
          description: Unique identifier of the tenant the user belongs to.
        trn:
          type: string
          description: TigerGraph resource name of the user.
        updated:
          type: string
          description: Time the user was last updated.
        username:
          type: string
          description: Username of the user.
    OrgMetadata:
      type: object
      properties:
        attachedTo:
          type: array
          items:
            type: string
          description: Resources the user is attached to.
        lastLogin:
          type: string
          description: Time the user last signed in.
    OrgRole:
      type: object
      properties:
        displayName:
          type: string
          description: Name of the role as it appears in the TigerGraph Savanna console.
        id:
          type: string
          description: Unique identifier of the role.
        name:
          type: string
          description: Name of the role.
        path:
          type: string
          description: Hierarchical path of the role within the organization.
        tenantID:
          type: string
          description: Unique identifier of the tenant the role belongs to.
        trn:
          type: string
          description: TigerGraph resource name of the role.
    Platform:
      type: string
      enum:
        - aws
        - azure
        - gcp
    PublicCloudProviderResource:
      type: object
      properties:
        component_versions:
          type: string
          description: Versions of the components installed for the provider.
        id:
          type: string
          description: Unique identifier of the public cloud provider.
        name:
          type: string
          description: Name of the public cloud provider.
        org_id:
          type: string
          description: Unique identifier of the organization that owns the provider.
        platform:
          type: string
          description: Cloud platform that hosts the provider.
        region:
          type: string
          description: Cloud region that hosts the provider.
        status:
          type: string
          description: Current status of the public cloud provider.
        version:
          type: string
          description: Version of the cloud provider deployment.
        version_number:
          type: integer
          description: Internal version number of the cloud provider record.
    PutOrgUsersRoles:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
          description: Roles to assign to the user, replacing the roles they hold now.
